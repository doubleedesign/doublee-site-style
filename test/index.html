<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Double-E Site Style Test Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100dvh;
            width: 100dvw;

            .wrapper__column {
                display: flex;
                flex-direction: column;

                .wrapper__column__label {
                    padding: 0.5rem;
                }

                iframe {
                    display: flex;
                    flex-grow: 1;
                    width: 100%;
                }
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="wrapper__column">
        <span class="wrapper__column__label">
            Typography mode: Default/blog <br/>
                <a href="tokens.html">See also: Tokens page</a>
        </span>
        <iframe src="./blog.html"></iframe>
    </div>
    <div class="wrapper__column">
        <span class="wrapper__column__label">
            Typography mode: Docs <br/>
                <a href="tokens.html">See also: Tokens page</a>
        </span>
        <iframe src="./docs.html"></iframe>
    </div>
</div>

</body>
</html>
